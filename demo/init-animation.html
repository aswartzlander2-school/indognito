<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indognito — initializing animation</title>
<style>
  :root {
    --bg: #120d0c;
    --grey: #26262b;      /* not started */
    --yellow: #ffd23d;    /* about to start (flashing) / started (solid) */
    --green: #3ccf6e;     /* finished */
    --blue: #3d8bff;      /* active */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: #f6ede8;
    font: 15px/1.5 -apple-system, 'Segoe UI', Inter, system-ui, sans-serif;
    display: grid; place-items: center; overflow: hidden;
  }
  .stage { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }

  /* full-bleed 25x25 grid background */
  .init-grid { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  .init-grid rect { rx: .18; fill: var(--grey); transition: fill .45s cubic-bezier(.2,.8,.2,1); }
  .init-grid rect.s { fill: var(--yellow); animation: flash 1.1s steps(2, jump-none) infinite; } /* about to start */
  .init-grid rect.p { fill: var(--yellow); animation: none; }                                     /* started */
  .init-grid rect.d { fill: var(--green); animation: none; }                                      /* finished */
  .init-grid rect.b { fill: var(--blue); animation: none; transition: fill .6s ease; }            /* active */
  @keyframes flash { 0% { opacity: 1; } 50% { opacity: .28; } 100% { opacity: 1; } }

  /* centered glassmorphic rounded box */
  .glass {
    position: relative; z-index: 1; text-align: center;
    padding: 34px 44px; border-radius: 24px;
    background: rgba(26, 19, 18, .55);
    border: 1px solid rgba(255, 220, 200, .18);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
  }
  .glass h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .glass p { margin: 8px 0 0; color: #c9b8b0; font-size: 14.5px; }
</style>
</head>
<body>
  <div class="stage">
    <svg class="init-grid" viewBox="0 0 25 25" preserveAspectRatio="xMidYMid slice" id="grid" aria-hidden="true"></svg>
    <div class="glass" role="status" aria-live="polite">
      <h1>Setting up Indognito.</h1>
      <p>This will take a minute.</p>
    </div>
  </div>

<script>
  // Standalone demo of the initialization animation. In the real app this is driven by actual
  // backend setup tasks + asset warming; here it runs on a simulated progress curve and loops.
  const CELL_PX = 46; // small cells, same size as the login background squares
  const cols = Math.max(14, Math.round(window.innerWidth / CELL_PX));
  const rows = Math.max(10, Math.round(window.innerHeight / CELL_PX));
  const CELLS = cols * rows;
  const PROC_BAND = Math.round(CELLS * 0.11);  // "started" (solid yellow) wave width
  const SCHED_BAND = Math.round(CELLS * 0.15); // "about to start" (flashing yellow) wave width
  const svg = document.getElementById('grid');
  svg.setAttribute('viewBox', '0 0 ' + cols + ' ' + rows);
  const rects = [];
  for (let i = 0; i < CELLS; i++) {
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('x', (i % cols) + 0.08);
    r.setAttribute('y', Math.floor(i / cols) + 0.08);
    r.setAttribute('width', 0.84);
    r.setAttribute('height', 0.84);
    r.style.animationDelay = (Math.random() * 1.1).toFixed(2) + 's';
    svg.appendChild(r);
    rects.push(r);
  }

  let order, posOf, shown, prog, target, done;

  function reset() {
    order = [...Array(CELLS).keys()];
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    posOf = new Array(CELLS);
    order.forEach((cell, pos) => { posOf[cell] = pos; });
    shown = new Array(CELLS).fill('');
    for (const r of rects) r.setAttribute('class', '');
    prog = 0; target = 0; done = false;
  }

  function render() {
    // simulate readiness creeping toward 1
    target = Math.min(1, target + 0.0016 + Math.random() * 0.0016);
    prog += Math.max((target - prog) * 0.06, prog < target ? 0.0012 : 0);
    if (prog > target) prog = target;
    const frontier = prog * CELLS;
    for (let cell = 0; cell < CELLS; cell++) {
      const i = posOf[cell];
      let cls;
      if (i < frontier - PROC_BAND) cls = 'd';
      else if (i < frontier) cls = 'p';
      else if (i < frontier + SCHED_BAND) cls = 's';
      else cls = '';
      if (shown[cell] !== cls) { shown[cell] = cls; rects[cell].setAttribute('class', cls); }
    }
    if (prog >= 0.9999 && target >= 1 && !done) return finish();
    requestAnimationFrame(render);
  }

  function finish() {
    done = true;
    for (const r of rects) r.setAttribute('class', 'd');   // all finished (green)
    setTimeout(() => {
      for (const r of rects) r.setAttribute('class', 'b'); // all active (blue)
      setTimeout(() => { reset(); requestAnimationFrame(render); }, 5000); // "refresh" after 5s (demo loops)
    }, 700);
  }

  reset();
  requestAnimationFrame(render);
</script>
</body>
</html>
