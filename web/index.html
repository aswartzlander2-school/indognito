<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#120d0c">
  <title>Indognito</title>
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/inter/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <style>
    /* Instant branded boot splash, shown before the app's JavaScript has finished loading. */
    #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #120d0c; z-index: 50; transition: opacity .35s ease; }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot .bmark { width: 76px; height: 76px; border-radius: 22px; background: linear-gradient(135deg,#ff3b30,#ff9a2e); display: grid; place-items: center; box-shadow: 0 16px 40px -10px rgba(229,50,45,.6); animation: bootpulse 1.4s ease-in-out infinite; }
    #boot .bmark svg { width: 46px; height: 46px; }
    #boot .bdots { display: flex; gap: 8px; margin-top: 26px; justify-content: center; }
    #boot .bdots i { width: 9px; height: 9px; border-radius: 3px; background: #ff8a2a; animation: bootflash 1.2s infinite; }
    #boot .bdots i:nth-child(2) { animation-delay: .18s; } #boot .bdots i:nth-child(3) { animation-delay: .36s; }
    @keyframes bootpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes bootflash { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { #boot .bmark, #boot .bdots i { animation: none; } }
  </style>
  <script src="js/errors-catalog.js"></script>
  <!-- Heavy engine libraries (Scramjet, bare-mux, xterm, WebAuthn) are loaded on demand by the
       views that need them (see loadScript in core.js), so the sign-in and home screens paint
       without pulling ~690 KB of blocking JavaScript first. -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <noscript><p style="padding:40px">Indognito needs JavaScript.</p></noscript>
  <div id="boot" role="status" aria-label="Loading Indognito">
    <div style="text-align:center">
      <div class="bmark"><svg viewBox="0 0 24 24" fill="none">
        <path d="M6.3 10.3c.6-3.2 1.7-4.8 5.7-4.8s5.1 1.6 5.7 4.8" fill="#fff"/>
        <rect x="3.4" y="10" width="17.2" height="1.9" rx=".95" fill="#fff"/>
        <circle cx="8.6" cy="15.4" r="2.7" fill="#fff"/><circle cx="15.4" cy="15.4" r="2.7" fill="#fff"/>
        <path d="M10.9 15c.7-.6 1.5-.6 2.2 0" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/>
        <circle cx="8.6" cy="15.5" r="1.05" fill="#e5322d"/><circle cx="15.4" cy="15.5" r="1.05" fill="#e5322d"/></svg></div>
      <div class="bdots"><i></i><i></i><i></i></div>
    </div>
  </div>
  <div id="app" aria-live="polite"></div>
  <div class="toasts" id="toasts" role="status"></div>
</body>
</html>
